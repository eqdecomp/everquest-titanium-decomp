; Copy to <workspace>\paths.local.ini and adjust. That file is never committed.
; Tools find the workspace via the EQD_ROOT environment variable, or by walking up from the repo
; to the first directory that contains paths.local.ini. The repo itself sits in <workspace>\eq-titanium.

[workspace]
; Your own EverQuest Titanium eqgame.exe goes under <original>\titanium\eqgame.exe.
original = original
ghidra   = ghidra
build    = build

[toolchain]
; Visual C++ .NET 2003 RTM (cl/c2 13.10.3077, link 7.10.3077): the folder holding Bin\cl.exe, include\, lib\.
; Not included; bring your own. doctor.py checks the versions.
vc71 = <path to the Vc7 folder>
; Optional: Ghidra 12.1.3 with PyGhidra (only for the export / context tooling)
;ghidra = <path to ghidra_12.1.3_PUBLIC>
